[package]
name = "beetry-example"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
anyhow.workspace = true
beetry-channel = { version = "0.1.0", path = "../beetry-channel" }
beetry-core = { version = "0.1.0", path = "../beetry-core" }
beetry-engine = { version = "0.1.0", path = "../beetry-engine", features = [
    "registry",
] }
beetry-editor-types = { version = "0.1.0", path = "../beetry-editor-types" }
beetry-macros = { version = "0.1.0", path = "../beetry-macros" }
beetry-plugin = { version = "0.1.0", path = "../beetry-plugin" }
beetry-reconstruction = { version = "0.1.0", path = "../beetry-reconstruction" }
bon.workspace = true
mitsein.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tracing.workspace = true
tracing-subscriber = "0.3.20"
tracing-tree = "0.4.0"
type_hash = "0.3.0"
