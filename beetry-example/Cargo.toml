[package]
name = "beetry-example"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
beetry-builder = { version = "0.1.0", path = "../beetry-builder" }
beetry-channel = { version = "0.1.0", path = "../beetry-channel" }
beetry-core = { version = "0.1.0", path = "../beetry-core" }
beetry-editor-types = { version = "0.1.0", path = "../beetry-editor-types" }
beetry-exec = { version = "0.1.0", path = "../beetry-exec" }
beetry-macros = { version = "0.1.0", path = "../beetry-macros" }
beetry-plugin = { version = "0.1.0", path = "../beetry-plugin" }
beetry-reconstruction = { version = "0.1.0", path = "../beetry-reconstruction" }
beetry-reconstruction-types = { version = "0.1.0", path = "../beetry-reconstruction-types" }
beetry-serialization = { version = "0.1.0", path = "../beetry-serialization" }
bon.workspace = true
mitsein.workspace = true
rfd = { version = "0.15.4", default-features = false, features = [
    "xdg-portal",
    "tokio",
] }
serde.workspace = true
tokio = { version = "1.47.1", features = ["macros", "rt"] }
tracing.workspace = true
tracing-subscriber = "0.3.19"
tracing-tree = "0.4.0"
type_hash = "0.3.0"
