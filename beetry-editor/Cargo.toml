[package]
name = "beetry-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
bon = "3.7.2"
beetry-core = { version = "0.1.0", path = "../beetry-core" }
beetry-serde = { version = "0.1.0", path = "../beetry-serde" }
beetry-plugin = { version = "0.1.0", path = "../beetry-plugin" }
beetry-serialization = { version = "0.1.0", path = "../beetry-serialization" }
dioxus = { version = "=0.7.0-rc.2", features = [] }
dioxus-logger = "=0.7.0-rc.2"
indexmap = "2.11.3"
rfd = { version = "0.15.4", default-features = false, features = [
    "xdg-portal",
    "tokio",
] }
serde.workspace = true
serde_json = "1.0"
tokio = { version = "1.47.1", features = ["time"] }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
