[package]
name = "beetry-node"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = ["registry"]
registry = [
    "dep:beetry-plugin",
    "dep:beetry-editor-types",
    "dep:beetry-reconstruction-types",
]

[dependencies]
beetry-core = { version = "0.1.0", path = "../beetry-core" }
beetry-plugin = { version = "0.1.0", path = "../beetry-plugin", optional = true }
beetry-editor-types = { version = "0.1.0", path = "../beetry-editor-types", optional = true }
beetry-reconstruction-types = { version = "0.1.0", path = "../beetry-reconstruction-types", optional = true }

[dev-dependencies]
beetry-core = { version = "0.1.0", features = [
    "mock",
], path = "../beetry-core" }

[lints]
workspace = true
