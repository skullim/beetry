[package]
name = "beetry-channel"
version = "0.1.0"
edition = "2024"
license.workspace = true

[features]
default = ["tokio"]
tokio = ["dep:tokio"]

[dependencies]
anyhow.workspace = true
beetry-core = { version = "0.1.0", path = "../beetry-core" }
beetry-message = { version = "0.1.0", path = "../beetry-message" }
tokio = { workspace = true, features = [
    "sync",
    "time",
    "macros",
], optional = true }
bon.workspace = true

[lints]
workspace = true
