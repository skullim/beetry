[package]
name = "beetry-channel"
version = "0.1.0"
edition = "2024"

[features]
default = ["tokio"]
tokio = ["dep:tokio"]

[dependencies]
anyhow.workspace = true
beetry-core = { version = "0.1.0", path = "../beetry-core" }
tokio = { workspace = true, features = [
    "sync",
    "time",
    "macros",
], optional = true }
bon.workspace = true
tupleops = "0.1.1"
