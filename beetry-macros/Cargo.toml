[package]
name = "beetry-macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
beetry-core = { version = "0.1.0", path = "../beetry-core" }
proc-macro-error = "1.0.4"
proc-macro2 = "1.0.101"
quote = "1.0.41"
syn = { version = "2.0.106", features = ["full"] }
bon.workspace = true


[dev-dependencies]
beetry-channel = { version = "0.1.0", path = "../beetry-channel" }
