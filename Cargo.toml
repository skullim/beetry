[workspace]
resolver = "3"
members = [
    "beetry",
    "beetry-backend",
    "beetry-example",
    "beetry-definitions",
    "beetry-editor",
    "beetry-editor-launch",
    "beetry-macros",
    "beetry-plugin",
    "beetry-reconstruction",
    "beetry-serialization",
]

[workspace.dependencies]
anyhow = "1.0.100"
bon = "3.8.1"
tracing = "0.1.41"
strum_macros = "0.27.2"
serde = "1.0.228"
thiserror = "2.0.17"
mitsein = {version = "0.7.0", features = ["serde"]}