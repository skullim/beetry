[workspace]
resolver = "3"
members = [
    "beetry",
    "beetry-builder",
    "beetry-channel",
    "beetry-core",
    "beetry-editor",
    "beetry-editor-launch",
    "beetry-example",
    "beetry-exec",
    "beetry-macros",
    "beetry-node",
    "beetry-plugin",
    "beetry-reconstruction",
    "beetry-serde",
    "beetry-serialization",
]

[workspace.dependencies]
anyhow = "1.0.100"
bon = "3.8.1"
derive-getters = "0.5.0"
derive_more = { version = "2.0.1", features = ["full"] }
mitsein = { version = "0.8.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
strum_macros = "0.27.2"
thiserror = "2.0.17"
tracing = "0.1.41"

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
